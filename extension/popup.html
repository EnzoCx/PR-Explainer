<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>PR Explainer</title>
  <style>
    :root {
      --bg: #ffffff; --bg2: #f6f8fa; --fg: #1f2328; --muted: #59636e; --border: #d0d7de;
      --ok: #2f8a4c; --ko: #d42a2a;
      --hand: "Ink Free", "Segoe Print", "Bradley Hand", cursive;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #161b22; --bg2: #0d1117; --fg: #e6edf3; --muted: #8d96a0; --border: #30363d; --ok: #5fd38a; --ko: #ff7b72; }
    }
    * { box-sizing: border-box; }
    body { width: 330px; margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 13px/1.45 -apple-system, "Segoe UI", system-ui, sans-serif; }
    header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    header img { width: 36px; height: 36px; }
    h1 { margin: 0; font-size: 15px; }
    .tag { color: var(--muted); font: 15px/1.1 var(--hand); }
    .version { margin-left: auto; align-self: flex-start; color: var(--muted); font-size: 11px; }
    h2 { margin: 16px 0 6px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
    .checks { background: var(--bg2); border-radius: 10px; padding: 2px 10px; }
    .check { display: flex; justify-content: space-between; padding: 6px 0; }
    .check + .check { border-top: 1px solid var(--border); }
    .ok { color: var(--ok); font-weight: 600; }
    .ko { color: var(--ko); font-weight: 600; }
    .muted { color: var(--muted); }
    .hint { margin-top: 8px; padding: 8px 10px; border-radius: 8px; background: rgba(212, 42, 42, .08); color: var(--ko); }
    .seg { display: flex; background: var(--bg2); border-radius: 9px; padding: 3px; gap: 3px; }
    .seg button { flex: 1; border: 0; background: none; color: var(--fg); padding: 6px; border-radius: 7px; cursor: pointer; font: inherit; }
    .seg button.on { background: var(--bg); box-shadow: 0 1px 3px rgba(0, 0, 0, .15); font-weight: 600; }
    .seg button:disabled { opacity: .4; cursor: default; }
    label.row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 7px 0; cursor: pointer; }
    label.row + label.row { border-top: 1px solid var(--border); }
    .sw { position: relative; width: 32px; height: 18px; flex: none; }
    .sw input { position: absolute; opacity: 0; }
    .sw i { position: absolute; inset: 0; border-radius: 99px; background: var(--border); transition: background .15s; }
    .sw i::after { content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform .15s; }
    .sw input:checked + i { background: var(--ok); }
    .sw input:checked + i::after { transform: translateX(14px); }
    .sw input:focus-visible + i { outline: 2px solid var(--fg); outline-offset: 2px; }
    details { margin-top: 14px; }
    summary { cursor: pointer; color: var(--muted); }
    textarea { width: 100%; height: 70px; margin-top: 6px; padding: 6px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--fg); font: 12px ui-monospace, Consolas, monospace; }
    small { color: var(--muted); }
    .btn { margin-top: 8px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg2); color: var(--fg); cursor: pointer; font: inherit; }
  </style>
</head>
<body>
  <header>
    <img src="icons/icon48.png" alt="">
    <div>
      <h1>PR Explainer</h1>
      <div class="tag" data-t="tagline"></div>
    </div>
    <span class="version" id="version"></span>
  </header>

  <h2 data-t="status"></h2>
  <div class="checks" id="checks"></div>
  <div id="hint"></div>

  <h2 data-t="aiUsed"></h2>
  <div class="seg" id="engine">
    <button data-v="auto">Auto</button>
    <button data-v="claude">Claude</button>
    <button data-v="codex">ChatGPT</button>
  </div>

  <h2 data-t="language"></h2>
  <div class="seg" id="lang">
    <button data-v="auto">Auto</button>
    <button data-v="en">English</button>
    <button data-v="fr">Français</button>
  </div>

  <h2 data-t="options"></h2>
  <label class="row"><span data-t="optAuto"></span>
    <span class="sw"><input type="checkbox" id="autoAnalyze"><i></i></span></label>
  <label class="row"><span data-t="optNotes"></span>
    <span class="sw"><input type="checkbox" id="showNotes"><i></i></span></label>
  <label class="row"><span data-t="optHideMechanical"></span>
    <span class="sw"><input type="checkbox" id="hideMechanical"><i></i></span></label>
  <label class="row"><span data-t="optProject"></span>
    <span class="sw"><input type="checkbox" id="useProject"><i></i></span></label>

  <details>
    <summary data-t="advanced"></summary>
    <small data-t="repoHelp"></small>
    <textarea id="repoPaths" placeholder="my-org/my-repo = C:\dev\my-repo"></textarea>
    <button class="btn" id="clearCache" data-t="clearCache"></button>
  </details>
  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
